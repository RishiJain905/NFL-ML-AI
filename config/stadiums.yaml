# Stadium coordinates and time zones. Two consumers:
#   - Open-Meteo forecasts (documentation/03 -> Additional free sources): lat/lon.
#   - Travel features (features/venues.py): lat/lon for great-circle distance, `tz` (IANA zone)
#     for the time-zone shift between a team's home venue and the game venue.
# Resolution order: stadium NAME (from schedules) first, then stadium_id. nflverse can keep
# the home team's stadium_id for neutral-site games (e.g. 2026 PHI@JAX at Tottenham has
# stadium_id JAX00), so names win. Coordinates are approximate (weather grid is ~km scale).
# `verify: true` marks entries whose nflverse id mapping is inferred, not confirmed.
# `tz` is required on every entry (DST is evaluated at kickoff, so Phoenix stays on MST).

stadiums:
