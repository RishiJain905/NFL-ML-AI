# Games whose nflverse `stadium` / `stadium_id` is wrong, mapped to the stadium actually used
# (game_id -> stadium_id). Checked against the play-by-play `stadium` name. nflverse lists the
# home team's own stadium for the 2025 international games although they were played abroad.
# Read only by features/venues.py; ingest/weather.py ignores this section.
game_venues:
  "2025_01_KC_LAC": SAO00   # Sao Paulo, Arena Corinthians (listed as SoFi Stadium)
  "2025_04_MIN_PIT": DUB00  # Dublin, Croke Park (listed as Acrisure Stadium)
  "2025_05_MIN_CLE": LON02  # London, Tottenham Hotspur Stadium (listed as FirstEnergy Stadium)
  "2025_06_DEN_NYJ": LON02  # London, Tottenham Hotspur Stadium (listed as MetLife Stadium)
  "2025_07_LA_JAX": LON00   # London, Wembley Stadium (listed as TIAA Bank Stadium)
  "2025_10_ATL_IND": GER00  # Berlin, Olympiastadion (listed as Lucas Oil Stadium)
  "2025_11_WAS_MIA": MAD01  # Madrid, Santiago Bernabeu (listed as Hard Rock Stadium)
