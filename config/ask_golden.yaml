# Ask the Engine: the golden question set (AE00; src/nflengine/ask/evaluate.py).
# Each answer question has a hand-written, checked reference query; its result on the day's data
# IS the expected answer (order-insensitive; the system may add columns, but every reference
# column must match one of the system's and the row counts must be equal). The evaluator binds
# $asof_season / $asof_week (the weekly graph's week, runs/<S>/week<NN>/graph_results.json) and
# $current_season (settings.yaml seasons.current). References return the minimal columns that
# define the answer (names, team codes, the number asked) and never tie at a LIMIT boundary.
# A template question's reference is written independently of the template's query: it checks
# the template too. Categories: template (a template fits), sql (free-form SQL), graph
# (free-form Cypher, relationships), trick (clarify / refuse).
version: 1
questions:
  # ==== template: a template in config/ask_templates.yaml fits =============================
  - id: g001
    question: "Which players have at least two 100-yard receiving games against Dallas since 2020?"
    category: template
    source: sql
    template: stat_games_vs_team
    reference: |
      WITH big AS (
        SELECT player_id, player_display_name, game_id
        FROM player_games
        WHERE opponent_team = 'DAL' AND season >= 2020 AND receiving_yards >= 100
      )
      SELECT player_display_name AS player, count(DISTINCT game_id) AS games
      FROM big GROUP BY player_id, player_display_name
      HAVING count(DISTINCT game_id) >= 2
    notes: README's first example, made exact with "at least two"; playoffs count (the template's default)

  - id: g002
    question: "Who led the NFL in rushing yards in the 2024 regular season?"
    category: template
    source: sql
    template: season_leaders
    reference: |
      WITH t AS (
        SELECT player_id, any_value(player_display_name) AS player, sum(rushing_yards) AS yards
        FROM player_games WHERE season = 2024 AND season_type = 'REG' GROUP BY player_id
      )
      SELECT player, yards FROM t ORDER BY yards DESC LIMIT 1
    notes: a single leader (Saquon Barkley, 2005)

  - id: g003
    question: "Who were the top 3 wide receivers in receiving touchdowns in the 2023 regular season?"
    category: template
    source: sql
    template: season_leaders
    reference: |
      SELECT any_value(player_display_name) AS player, sum(receiving_tds) AS tds
      FROM player_games
      WHERE season = 2023 AND season_type = 'REG' AND position_group = 'WR'
      GROUP BY player_id
      ORDER BY tds DESC, player
      LIMIT 3
    notes: position filter + limit (13, 13, 12; the 4th has 10, so no tie at 3; top 5 would tie)

  - id: g004
    question: "Who had the most sacks in the 2025 regular season?"
    category: template
    source: sql
    template: season_leaders
    reference: |
      SELECT any_value(player_display_name) AS player, sum(def_sacks) AS sacks
      FROM player_games WHERE season = 2025 AND season_type = 'REG'
      GROUP BY player_id ORDER BY sacks DESC LIMIT 1
    notes: defensive stat; half sacks

  - id: g005
    question: "What were Justin Jefferson's regular-season receiving yards each year?"
    category: template
    source: sql
    template: player_seasons
    reference: |
      SELECT season, sum(receiving_yards) AS receiving_yards
      FROM player_games
      WHERE player_display_name = 'Justin Jefferson' AND position = 'WR' AND season_type = 'REG'
      GROUP BY season
    notes: one row per season, 2020 to this season

  - id: g006
    question: "How many passing yards did Josh Allen throw for in each game this season?"
    category: template
    source: sql
    template: player_game_log
    reference: |
      SELECT pg.week, pg.passing_yards
      FROM player_games pg JOIN players p ON p.gsis_id = pg.player_id
      WHERE p.display_name = 'Josh Allen' AND p.position = 'QB' AND pg.season = $current_season
    notes: this season = $current_season; grows each week

  - id: g007
    question: "What was the Lions' regular-season record each year from 2020 to 2025?"
    category: template
    source: sql
    template: team_record
    reference: |
      SELECT season,
             sum(CASE WHEN (home_team = 'DET' AND result > 0) OR (away_team = 'DET' AND result < 0) THEN 1 ELSE 0 END) AS wins,
             sum(CASE WHEN (home_team = 'DET' AND result < 0) OR (away_team = 'DET' AND result > 0) THEN 1 ELSE 0 END) AS losses,
             sum(CASE WHEN result = 0 THEN 1 ELSE 0 END) AS ties
      FROM games
      WHERE game_type = 'REG' AND season BETWEEN 2020 AND 2025 AND 'DET' IN (home_team, away_team)
        AND result IS NOT NULL
      GROUP BY season
    notes: uses games.result (home minus away) instead of the scores

  - id: g008
    question: "What's the Bills' record against the Chiefs since 2018, playoffs included?"
    category: template
    source: sql
    template: head_to_head
    reference: |
      SELECT count(*) AS games,
             count(*) FILTER (WHERE (home_team = 'BUF' AND result > 0) OR (away_team = 'BUF' AND result < 0)) AS wins,
             count(*) FILTER (WHERE (home_team = 'BUF' AND result < 0) OR (away_team = 'BUF' AND result > 0)) AS losses
      FROM games
      WHERE season >= 2018 AND result IS NOT NULL
        AND ((home_team = 'BUF' AND away_team = 'KC') OR (home_team = 'KC' AND away_team = 'BUF'))
    notes: one summary row; the four playoff meetings count

  - id: g009
    question: "What were the Steelers' scores in every 2025 game, playoffs included?"
    category: template
    source: sql
    template: team_season_results
    reference: |
      SELECT week,
             CASE WHEN home_team = 'PIT' THEN away_team ELSE home_team END AS opponent,
             CASE WHEN home_team = 'PIT' THEN home_score ELSE away_score END AS steelers_points,
             CASE WHEN home_team = 'PIT' THEN away_score ELSE home_score END AS opponent_points
      FROM games WHERE season = 2025 AND (home_team = 'PIT' OR away_team = 'PIT')
    notes: 17 regular-season games + the wild-card game

  - id: g010
    question: "Which team had the best defense by EPA per play allowed in the 2024 regular season?"
    category: template
    source: sql
    template: team_epa_by_season
    reference: |
      SELECT defteam AS team, avg(epa) AS epa_allowed
      FROM plays
      WHERE season = 2024 AND season_type = 'REG' AND play_type IN ('pass', 'run')
        AND coalesce(two_point_attempt, 0) = 0 AND epa IS NOT NULL
      GROUP BY defteam ORDER BY epa_allowed LIMIT 1
    notes: lower EPA allowed is better (Denver)

  - id: g011
    question: "How many regular-season games did Sean Payton win each season as a head coach?"
    category: template
    source: sql
    template: coach_record
    reference: |
      SELECT season,
             count(*) FILTER (WHERE (home_coach = 'Sean Payton' AND result > 0)
                                 OR (away_coach = 'Sean Payton' AND result < 0)) AS wins
      FROM games
      WHERE game_type = 'REG' AND result IS NOT NULL
        AND (home_coach = 'Sean Payton' OR away_coach = 'Sean Payton')
      GROUP BY season
    notes: no 2012 (suspended) or 2022 (away from coaching) rows

  - id: g012
    question: "How often do the Lions use play action on each down this season, and what's their EPA on those plays?"
    category: template
    source: sql
    template: play_action_by_down
    reference: |
      WITH db AS (
        SELECT p.down, p.epa, f.is_play_action AS pa
        FROM ftn_plays f
        JOIN plays p ON p.game_id = f.nflverse_game_id AND CAST(p.play_id AS INTEGER) = f.nflverse_play_id
        WHERE p.season = $current_season AND p.season_type = 'REG' AND p.posteam = 'DET'
          AND p.qb_dropback = 1 AND p.play_type IN ('pass', 'run')
          AND coalesce(p.two_point_attempt, 0) = 0 AND p.down IS NOT NULL
          AND NOT (coalesce(trim(f.qb_location), '') IN ('', '0') AND coalesce(f.n_defense_box, 0) = 0)
      )
      SELECT CAST(down AS INTEGER) AS down, avg(CASE WHEN pa THEN 1.0 ELSE 0.0 END) AS play_action_rate,
             avg(epa) FILTER (WHERE pa) AS epa_play_action
      FROM db GROUP BY down
    notes: README's example; FTN placeholder rows dropped; dropbacks only

  - id: g013
    question: "Which 5 teams had the highest pass rate over expected in neutral situations in the 2025 regular season?"
    category: template
    source: sql
    template: neutral_pass_rate
    reference: |
      SELECT posteam AS team, avg(pass_oe) AS proe
      FROM plays
      WHERE season = 2025 AND season_type = 'REG' AND play_type IN ('pass', 'run')
        AND coalesce(two_point_attempt, 0) = 0
        AND wp >= 0.2 AND wp <= 0.8 AND down IN (1, 2, 3) AND half_seconds_remaining > 120
      GROUP BY posteam ORDER BY proe DESC LIMIT 5
    notes: neutral = win probability 20-80%, downs 1-3, not the last 2 minutes of a half

  - id: g014
    question: "How often did the Lions go for it on fourth down in the 2023 regular season?"
    category: template
    source: sql
    template: fourth_down_decisions
    reference: |
      SELECT count(*) AS fourth_downs,
             sum(CASE WHEN play_type IN ('pass', 'run') THEN 1 ELSE 0 END) AS go_attempts,
             sum(CASE WHEN play_type IN ('pass', 'run') THEN 1 ELSE 0 END) * 1.0 / count(*) AS go_rate
      FROM plays
      WHERE season = 2023 AND season_type = 'REG' AND posteam = 'DET' AND down = 4
        AND play_type IN ('pass', 'run', 'punt', 'field_goal')
    notes: fourth downs = runs, passes (fakes included), punts and field goals; penalties and kneels left out

  - id: g015
    question: "What was the Bills' red-zone touchdown rate in the 2025 regular season?"
    category: template
    source: sql
    template: red_zone_td_rate
    reference: |
      WITH drives AS (
        SELECT game_id, fixed_drive, bool_or(drive_inside20 = 1) AS rz,
               bool_or(fixed_drive_result = 'Touchdown') AS td
        FROM plays
        WHERE season = 2025 AND season_type = 'REG' AND posteam = 'BUF' AND down IS NOT NULL
        GROUP BY game_id, fixed_drive
      )
      SELECT count(*) FILTER (WHERE rz) AS red_zone_drives,
             count(*) FILTER (WHERE rz AND td) AS red_zone_tds,
             count(*) FILTER (WHERE rz AND td) * 1.0 / count(*) FILTER (WHERE rz) AS td_rate
      FROM drives
    notes: drives counted from snaps (rows with a down), per the LD02 quirk

  - id: g016
    question: "What were the three longest plays from scrimmage in the 2024 season?"
    category: template
    source: sql
    template: longest_plays
    reference: |
      SELECT game_id, posteam AS team, yards_gained AS yards
      FROM plays
      WHERE season = 2024 AND play_type IN ('pass', 'run') AND coalesce(two_point_attempt, 0) = 0
      ORDER BY yards_gained DESC LIMIT 3
    notes: 98, 97 and 93 yards; the 4th is shorter (no tie)

  - id: g017
    question: "How many receiving yards has Travis Kelce had in each game against the Raiders?"
    category: template
    source: sql
    template: player_vs_team
    reference: |
      SELECT season, week, receiving_yards
      FROM player_games
      WHERE player_display_name = 'Travis Kelce' AND opponent_team = 'LV'
    notes: the Raiders' code is LV in every season (OAK games included)

  - id: g018
    question: "Which teams has Kirk Cousins been on each season since 2018?"
    category: template
    source: graph
    template: player_teams
    reference: |
      MATCH (t:Team)<-[r:PLAYED_FOR]-(p:Player)
      WHERE p.name = 'Kirk Cousins' AND p.position = 'QB'
      RETURN r.season AS season, t.team_id AS team
    notes: MIN 2018-2023, ATL 2024-2025, LV 2026

  - id: g019
    question: "Who were Patrick Mahomes' three most-targeted receivers in 2025?"
    category: template
    source: graph
    template: qb_receivers
    reference: |
      MATCH (q:Player {name: 'Patrick Mahomes'})-[t:THREW_TO {season: 2025}]->(r:Player)
      RETURN r.name AS receiver, t.targets AS targets
      ORDER BY targets DESC LIMIT 3
    notes: one THREW_TO per QB-receiver-season-team; checked no tie at 3

  - id: g020
    question: "In which seasons were Stefon Diggs and Josh Allen teammates?"
    category: template
    source: graph
    template: teammates
    reference: |
      MATCH (d:Player {name: 'Stefon Diggs'})-[a:PLAYED_FOR]->(t:Team)<-[b:PLAYED_FOR]-(j:Player {name: 'Josh Allen'})
      WHERE a.season = b.season AND j.position = 'QB'
        AND any(w IN a.roster_weeks WHERE w IN b.roster_weeks)
      RETURN a.season AS season, t.team_id AS team
    notes: BUF 2020-2023

  - id: g021
    question: "What was Kyle Shanahan's regular-season record each season from 2018 to 2025?"
    category: template
    source: graph
    template: coach_head_record
    reference: |
      MATCH (c:Coach {name: 'Kyle Shanahan'})-[ci:COACHED_IN]->(g:Game)
      WHERE g.game_type = 'REG' AND g.completed AND g.season >= 2018 AND g.season <= 2025
      WITH g, CASE WHEN ci.team_id = g.home_team THEN g.home_score - g.away_score
                   ELSE g.away_score - g.home_score END AS margin
      RETURN g.season AS season,
             count(CASE WHEN margin > 0 THEN 1 END) AS wins,
             count(CASE WHEN margin < 0 THEN 1 END) AS losses
    notes: from the scores of the games he coached; coach_record (SQL) gives the same numbers

  - id: g022
    question: "Which coordinators have worked under Kyle Shanahan?"
    category: template
    source: graph
    template: coaching_tree
    reference: |
      MATCH (x:Coach)-[:WORKED_UNDER]->(:Coach {name: 'Kyle Shanahan'})
      RETURN DISTINCT x.name AS coach
    notes: the coaching seed's coordinators (OC / DC / ST); only his proteges, not his mentors

  - id: g023
    question: "How has the 49ers' net rating moved week by week this season?"
    category: template
    source: graph
    template: team_rating_trend
    reference: |
      MATCH (tw:TeamWeek)
      WHERE tw.team_id = 'SF' AND tw.season = $asof_season AND tw.week <= $asof_week
      RETURN tw.week AS week, tw.net AS net_rating
    notes: as-of weeks 1 to the graph's week

  - id: g024
    question: "Which five teams have the best defenses by your ratings right now?"
    category: template
    source: graph
    template: power_ratings_this_week
    reference: |
      MATCH (tw:TeamWeek {season: $asof_season, week: $asof_week})
      RETURN tw.team_id AS team, tw.def_epa AS defense
      ORDER BY defense ASC LIMIT 5
    notes: def_epa is EPA allowed (lower is better); can tie only by chance

  - id: g025
    question: "What scores do you predict for this week's games?"
    category: template
    source: graph
    template: game_predictions_this_week
    reference: |
      MATCH (gp:GamePrediction {is_primary: true})<-[:HAS_PREDICTION]-(g:Game)
      WHERE g.season = $asof_season AND g.week = $asof_week
      RETURN g.game_id AS game_id, gp.pred_away_points AS away_points, gp.pred_home_points AS home_points
    notes: the primary prediction per game

  - id: g026
    question: "Which Ravens are listed Out or Doubtful on the latest injury report?"
    category: template
    source: graph
    template: injury_report_this_week
    reference: |
      MATCH (p:Player)-[i:ON_INJURY_REPORT]->(g:Game {season: $asof_season})
      WHERE i.team_id = 'BAL' AND i.status IS NOT NULL AND g.week <= $asof_week
      WITH max(g.week) AS wk
      MATCH (p:Player)-[i:ON_INJURY_REPORT]->(g:Game {season: $asof_season, week: wk})
      WHERE i.team_id = 'BAL' AND i.status IN ['Out', 'Doubtful']
      RETURN p.name AS player, i.status AS status
    notes: the Tuesday graph has last week's game statuses (this week's come Friday)

  - id: g027
    question: "Who's on the Cowboys' quarterback depth chart?"
    category: template
    source: graph
    template: depth_chart
    reference: |
      MATCH (p:Player)-[d:DEPTH_CHART]->(:Team {team_id: 'DAL'})
      WHERE d.season = $asof_season AND d.position = 'QB'
      WITH max(d.week) AS wk
      MATCH (p:Player)-[d:DEPTH_CHART {season: $asof_season, week: wk, position: 'QB'}]->(:Team {team_id: 'DAL'})
      RETURN d.rank AS rank, p.name AS player
    notes: the latest chart in the graph

  - id: g028
    question: "Which past player-seasons is Puka Nacua's usage most similar to?"
    category: template
    source: graph
    template: similar_players
    reference: |
      MATCH (:Player {name: 'Puka Nacua'})-[s:SIMILAR_TO]->(o:Player)
      RETURN o.name AS player, s.other_season AS season
    notes: the top 3 KNN neighbours written by GDS this week

  - id: g029
    question: "Who is the hub of the Vikings' passing game this season?"
    category: template
    source: graph
    template: passing_hubs
    reference: |
      MATCH (p:Player)-[c:PASS_CENTRALITY {season: $asof_season, role: 'receiver'}]->(:Team {team_id: 'MIN'})
      RETURN p.name AS player ORDER BY c.share DESC LIMIT 1
    notes: rank 1 by PageRank share

  - id: g030
    question: "Which players did the Lions draft in 2021?"
    category: template
    source: graph
    template: team_draft_picks
    reference: |
      MATCH (p:Player)-[d:DRAFTED_BY {year: 2021}]->(:Team {team_id: 'DET'})
      RETURN p.name AS player, d.round AS round
    notes: players in the weekly graph (all seven 2021 picks are)

  - id: g031
    question: "Which players have the Browns traded away since 2023?"
    category: template
    source: graph
    template: trades
    reference: |
      MATCH (p:Player)-[tr:TRADED_TO]->(t:Team)
      WHERE tr.from_team = 'CLE' AND tr.season >= 2023
      RETURN p.name AS player, t.team_id AS to_team
    notes: player trades only (pick rows excluded at build time)

  - id: g032
    question: "Who started at quarterback for the Jets in 2025, and how many starts did each get?"
    category: template
    source: graph
    template: qb_starters
    reference: |
      MATCH (p:Player)-[a:APPEARED_IN]->(g:Game {season: 2025})
      WHERE a.team_id = 'NYJ' AND a.qb_started = true
      RETURN p.name AS quarterback, count(g) AS starts
    notes: Fields 7, Taylor 5, Cook 5

  - id: g033
    question: "Which games this week have a big special-teams gap between the two teams?"
    category: template
    source: graph
    template: special_teams_edges_this_week
    reference: |
      MATCH (a:Team)-[h:PLAYED_IN]->(g:Game {season: $asof_season, week: $asof_week})<-[:PLAYED_IN]-(b:Team)
      WHERE h.home
      MATCH (a)-[x:PLAYED_IN]->(ga:Game {season: $asof_season})
      WHERE ga.week < $asof_week AND ga.completed AND x.st_epa IS NOT NULL
      WITH g, a, b, count(x) AS an, avg(x.st_epa) AS ast
      MATCH (b)-[y:PLAYED_IN]->(gb:Game {season: $asof_season})
      WHERE gb.week < $asof_week AND gb.completed AND y.st_epa IS NOT NULL
      WITH g, a, b, an, ast, count(y) AS bn, avg(y.st_epa) AS bst
      WITH g, a, b, an, bn, ast - bst AS gap, CASE WHEN an < bn THEN an ELSE bn END AS n
      WHERE an >= 3 AND bn >= 3 AND abs(gap) * n / (n + 4.0) >= 2.0
      RETURN g.game_id AS game_id, a.team_id AS home_team, b.team_id AS away_team
    notes: re-derives q12's rule (>= 3 games each, shrunk gap >= 2 EPA per game)

  - id: g034
    question: "Which quarterbacks face a receiver they used to throw to this week?"
    category: template
    source: graph
    template: former_teammates_this_week
    reference: |
      MATCH (g:Game {season: $asof_season, week: $asof_week})
      UNWIND [[g.home_qb_expected, g.away_team], [g.away_qb_expected, g.home_team]] AS side
      WITH g, side[0] AS qid, side[1] AS opp
      WHERE qid IS NOT NULL
      MATCH (qb:Player {player_id: qid})-[t:THREW_TO]->(r:Player)
      WHERE r <> qb
      WITH g, opp, qb, r, sum(t.targets) AS targets
      WHERE targets >= 40
      MATCH (r)-[cur:PLAYED_FOR {season: $asof_season}]->(o:Team {team_id: opp})
      WHERE cur.last_week >= $asof_week - 1 AND coalesce(cur.status_last, 'ACT') <> 'RES'
        AND NOT EXISTS { MATCH (r)-[x:ON_INJURY_REPORT]->(g) WHERE x.status IN ['Out', 'Doubtful'] }
        AND NOT EXISTS { MATCH (r)-[o2:PLAYED_FOR {season: $asof_season}]->(t2:Team)
                         WHERE t2 <> o AND o2.first_week > cur.last_week }
        AND EXISTS { MATCH (r)-[a:APPEARED_IN]->(x:Game {season: $asof_season})
                     WHERE a.team_id = opp AND x.week < $asof_week }
      RETURN qb.name AS qb, r.name AS receiver
    notes: re-derives q6 (40+ career targets, the receiver active on the opponent)

  - id: g116
    question: "Which quarterback threw the most touchdown passes in the 2024 playoffs?"
    category: template
    source: sql
    template: season_leaders
    reference: |
      WITH t AS (
        SELECT player_id, any_value(player_display_name) AS player, sum(passing_tds) AS tds
        FROM player_games WHERE season = 2024 AND season_type = 'POST' GROUP BY player_id
      )
      SELECT player, tds FROM t WHERE tds = (SELECT max(tds) FROM t)
    notes: >-
      AE01's own-question round: a three-way tie (Jalen Hurts, Jayden Daniels, Patrick Mahomes,
      5 each), so every tied leader is the answer; LIMIT 1 named only Hurts until season_leaders
      kept the rows tied at the cut (QUALIFY rank())

  # ==== sql: free-form SQL (no template fits) ==============================================
  - id: g040
    question: "Which quarterback had the highest completion percentage in the 2024 regular season, minimum 300 attempts?"
    category: sql
    source: sql
    reference: |
      SELECT any_value(player_display_name) AS player, sum(completions) * 1.0 / sum(attempts) AS completion_pct
      FROM player_games WHERE season = 2024 AND season_type = 'REG'
      GROUP BY player_id HAVING sum(attempts) >= 300
      ORDER BY completion_pct DESC LIMIT 1
    notes: a ratio with a volume floor

  - id: g041
    question: "Which defense allowed the fewest passing yards per game in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT opponent_team AS team, avg(passing_yards) AS passing_yards_allowed_per_game
      FROM team_games WHERE season = 2025 AND season_type = 'REG'
      GROUP BY opponent_team ORDER BY passing_yards_allowed_per_game LIMIT 1
    notes: team_games read from the opponent's side (passing_yards is gross of sacks)

  - id: g042
    question: "What was the average margin of victory in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT avg(abs(result)) AS avg_margin
      FROM games WHERE season = 2025 AND game_type = 'REG' AND result IS NOT NULL AND result <> 0
    notes: one number; ties left out (a tie has no victory; the audit of 2026-10-18 changed it from "ties count as 0")

  - id: g043
    question: "How many 2025 regular-season games went to overtime?"
    category: sql
    source: sql
    reference: |
      SELECT count(*) AS overtime_games
      FROM games WHERE season = 2025 AND game_type = 'REG' AND overtime = 1
    notes: games.overtime

  - id: g044
    question: "Which team forced the most turnovers in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT opponent_team AS team, sum(passing_interceptions + fumbles_lost_total) AS takeaways
      FROM team_games WHERE season = 2025 AND season_type = 'REG'
      GROUP BY opponent_team ORDER BY takeaways DESC LIMIT 1
    notes: takeaways = the opponents' interceptions + fumbles lost (curated-data P08 quirk)

  - id: g045
    question: "Which kickers made at least 8 field goals of 50 or more yards in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT any_value(player_display_name) AS kicker, sum(fg_made_50_59 + fg_made_60_) AS made_50_plus
      FROM player_games WHERE season = 2025 AND season_type = 'REG'
      GROUP BY player_id HAVING sum(fg_made_50_59 + fg_made_60_) >= 8
    notes: kicking columns in player_games

  - id: g046
    question: "Which defense blitzed most often in the 2025 regular season, according to FTN charting?"
    category: sql
    source: sql
    reference: |
      SELECT p.defteam AS team, avg(CASE WHEN f.n_blitzers > 0 THEN 1.0 ELSE 0.0 END) AS blitz_rate
      FROM plays p
      JOIN ftn_plays f ON f.nflverse_game_id = p.game_id AND f.nflverse_play_id = CAST(p.play_id AS INTEGER)
      WHERE p.season = 2025 AND p.season_type = 'REG' AND p.qb_dropback = 1
        AND p.play_type IN ('pass', 'run') AND coalesce(p.two_point_attempt, 0) = 0
        AND NOT (coalesce(trim(f.qb_location), '') IN ('', '0') AND coalesce(f.n_defense_box, 0) = 0)
      GROUP BY p.defteam ORDER BY blitz_rate DESC LIMIT 1
    notes: blitz = FTN n_blitzers > 0 on a dropback; placeholder rows dropped

  - id: g047
    question: "Who had the most receiving yards after the catch in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT any_value(player_display_name) AS player, sum(receiving_yards_after_catch) AS yac
      FROM player_games WHERE season = 2025 AND season_type = 'REG'
      GROUP BY player_id ORDER BY yac DESC LIMIT 1
    notes: a box-score column no template exposes

  - id: g048
    question: "What is the Chiefs' record in games decided by 3 points or fewer since 2020, playoffs included?"
    category: sql
    source: sql
    reference: |
      SELECT count(*) FILTER (WHERE (home_team = 'KC' AND result > 0) OR (away_team = 'KC' AND result < 0)) AS wins,
             count(*) FILTER (WHERE (home_team = 'KC' AND result < 0) OR (away_team = 'KC' AND result > 0)) AS losses,
             count(*) FILTER (WHERE result = 0) AS ties
      FROM games
      WHERE season >= 2020 AND 'KC' IN (home_team, away_team) AND result IS NOT NULL AND abs(result) <= 3
    notes: close games

  - id: g049
    question: "Which players have had a 200-yard rushing game since 2020?"
    category: sql
    source: sql
    reference: |
      SELECT DISTINCT player_display_name AS player
      FROM player_games WHERE season >= 2020 AND rushing_yards >= 200
    notes: one row per player ("which players"; was one row per game until the 2026-10-18 audit), playoffs included

  - id: g050
    question: "Which quarterbacks threw 5 or more touchdown passes in a game in the 2024 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT DISTINCT player_display_name AS player
      FROM player_games WHERE season = 2024 AND season_type = 'REG' AND passing_tds >= 5
    notes: one row per quarterback ("which quarterbacks"; was one row per game until the 2026-10-18 audit)

  - id: g051
    question: "Which quarterback had the quickest average time to throw in the 2025 regular season (Next Gen Stats, at least 300 attempts)?"
    category: sql
    source: sql
    reference: |
      SELECT player_display_name AS player, avg_time_to_throw
      FROM ngs_passing
      WHERE season = 2025 AND season_type = 'REG' AND week = 0 AND attempts >= 300
      ORDER BY avg_time_to_throw LIMIT 1
    notes: NGS week 0 rows are season totals

  - id: g052
    question: "Who led the NFL in pressures in the 2025 regular season, according to PFR?"
    category: sql
    source: sql
    reference: |
      SELECT any_value(pfr_player_name) AS player, sum(def_pressures) AS pressures
      FROM pfr_def WHERE season = 2025 AND game_type = 'REG'
      GROUP BY gsis_id ORDER BY pressures DESC LIMIT 1
    notes: PFR advanced defense (2018+)

  - id: g053
    question: "How many points per game did the Lions score at home and on the road in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT CASE WHEN home_team = 'DET' THEN 'home' ELSE 'road' END AS venue,
             avg(CASE WHEN home_team = 'DET' THEN home_score ELSE away_score END) AS points_per_game
      FROM games
      WHERE season = 2025 AND game_type = 'REG' AND completed AND 'DET' IN (home_team, away_team)
      GROUP BY venue
    notes: two rows labelled with the question's words, home / road (was "away" until the 2026-10-18 audit); a neutral-site game counts by its listed home team

  - id: g054
    question: "How many 2025 regular-season games went over the closing total, and how many went under?"
    category: sql
    source: sql
    reference: |
      SELECT count(*) FILTER (WHERE total > total_line) AS overs,
             count(*) FILTER (WHERE total < total_line) AS unders
      FROM games WHERE season = 2025 AND game_type = 'REG' AND completed AND total_line IS NOT NULL
    notes: games.total_line is nflverse's closing total; the two counts asked (a pushes column was dropped in the 2026-10-18 audit, not asked)

  - id: g055
    question: "How many times did home favorites cover the spread in the 2025 regular season, and in how many games?"
    category: sql
    source: sql
    reference: |
      SELECT count(*) AS games,
             count(*) FILTER (WHERE result > spread_line) AS covered
      FROM games
      WHERE season = 2025 AND game_type = 'REG' AND completed AND spread_line > 0
    notes: spread_line > 0 = the home team is favoured (nflverse sign); covered = won by more than the line; the covers and the games, as asked (worded "How often ..." until Sol's second review, where a rate-only answer was right but couldn't match, and a rate's denominator depends on pushes; did-not-cover and pushes columns dropped in the 2026-10-18 audit, not asked)

  - id: g056
    question: "Who scored the most rushing plus receiving touchdowns in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT any_value(player_display_name) AS player, sum(rushing_tds + receiving_tds) AS touchdowns
      FROM player_games WHERE season = 2025 AND season_type = 'REG'
      GROUP BY player_id ORDER BY touchdowns DESC LIMIT 1
    notes: a sum of two stats

  - id: g057
    question: "Which three rookies had the most receiving yards in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT any_value(pg.player_display_name) AS player, sum(pg.receiving_yards) AS receiving_yards
      FROM player_games pg JOIN players p ON p.gsis_id = pg.player_id
      WHERE pg.season = 2025 AND pg.season_type = 'REG' AND p.rookie_season = 2025
      GROUP BY pg.player_id ORDER BY receiving_yards DESC LIMIT 3
    notes: rookie = players.rookie_season

  - id: g058
    question: "Which teams won at least 6 one-score games (8 points or fewer) in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      WITH w AS (
        SELECT CASE WHEN result > 0 THEN home_team ELSE away_team END AS team
        FROM games
        WHERE season = 2025 AND game_type = 'REG' AND result IS NOT NULL AND result <> 0 AND abs(result) <= 8
      )
      SELECT team, count(*) AS one_score_wins FROM w GROUP BY team HAVING count(*) >= 6
    notes: winners of games decided by 1-8 points

  - id: g059
    question: "What was the coldest game of the 2025 season?"
    category: sql
    source: sql
    reference: |
      SELECT game_id, temp
      FROM games
      WHERE season = 2025 AND completed AND roof IN ('outdoors', 'open') AND temp IS NOT NULL
      ORDER BY temp LIMIT 1
    notes: kickoff temperature (F), outdoor games only (domes carry a dummy reading)

  - id: g060
    question: "How often did teams convert on 4th-and-1 when they went for it in the 2025 regular season?"
    category: sql
    source: sql
    reference: |
      SELECT count(*) AS attempts,
             avg(CASE WHEN first_down = 1 OR (touchdown = 1 AND td_team = posteam) THEN 1.0 ELSE 0.0 END) AS conversion_rate
      FROM plays
      WHERE season = 2025 AND season_type = 'REG' AND down = 4 AND ydstogo = 1
        AND play_type IN ('pass', 'run')
    notes: league-wide; a go = a run or pass on 4th down (fakes included)

  - id: g061
    question: "Which receivers had at least 9 drops in the 2025 regular season, according to FTN?"
    category: sql
    source: sql
    reference: |
      SELECT any_value(pl.display_name) AS player, count(*) AS drops
      FROM plays p
      JOIN ftn_plays f ON f.nflverse_game_id = p.game_id AND f.nflverse_play_id = CAST(p.play_id AS INTEGER)
      JOIN players pl ON pl.gsis_id = p.receiver_player_id
      WHERE p.season = 2025 AND p.season_type = 'REG' AND f.is_drop
      GROUP BY p.receiver_player_id HAVING count(*) >= 9
    notes: FTN is_drop joined to the play's target (three receivers tie at 10, so no "most")

  - id: g062
    question: "How many QB sneaks did the Eagles run in the 2024 regular season, and what was their success rate?"
    category: sql
    source: sql
    reference: |
      SELECT count(*) AS sneaks, avg(p.success) AS success_rate
      FROM plays p
      JOIN ftn_plays f ON f.nflverse_game_id = p.game_id AND f.nflverse_play_id = CAST(p.play_id AS INTEGER)
      WHERE p.season = 2024 AND p.season_type = 'REG' AND p.posteam = 'PHI' AND f.is_qb_sneak
        AND p.play_type = 'run' AND coalesce(p.two_point_attempt, 0) = 0
    notes: FTN is_qb_sneak (the tush push era); two-point tries left out, as for every per-play count (added in the 2026-10-18 audit)

  - id: g063
    question: "What was the most points a team scored in a single game in the 2025 season?"
    category: sql
    source: sql
    reference: |
      WITH s AS (
        SELECT game_id, home_team AS team, home_score AS points FROM games WHERE season = 2025 AND completed
        UNION ALL
        SELECT game_id, away_team, away_score FROM games WHERE season = 2025 AND completed
      )
      SELECT points FROM s ORDER BY points DESC LIMIT 1
    notes: checked, no tie for the top score; the number asked (game_id and team were required until the 2026-10-18 audit)

  - id: g064
    question: "Which head coaches have won more than one Super Bowl since 1999?"
    category: sql
    source: sql
    reference: |
      SELECT CASE WHEN result > 0 THEN home_coach ELSE away_coach END AS coach, count(*) AS super_bowls
      FROM games WHERE game_type = 'SB' AND result IS NOT NULL
      GROUP BY coach HAVING count(*) > 1
    notes: games 1999+ (the 1999 season's Super Bowl on)

  - id: g065
    question: "Which teams made the playoffs every season from 2020 to 2025?"
    category: sql
    source: sql
    reference: |
      WITH pt AS (
        SELECT season, home_team AS team FROM games WHERE game_type <> 'REG' AND season BETWEEN 2020 AND 2025
        UNION
        SELECT season, away_team FROM games WHERE game_type <> 'REG' AND season BETWEEN 2020 AND 2025
      )
      SELECT team FROM pt GROUP BY team HAVING count(DISTINCT season) = 6
    notes: a playoff game in each of six seasons

  # ==== graph: free-form Cypher over the weekly graph's relationships =====================
  - id: g070
    question: "Which current Buccaneers played with Saquon Barkley on the Giants?"
    category: graph
    source: graph
    reference: |
      MATCH (s:Player {name: 'Saquon Barkley'})-[a:PLAYED_FOR]->(:Team {team_id: 'NYG'})<-[b:PLAYED_FOR]-(o:Player)
      WHERE a.season = b.season AND any(w IN a.roster_weeks WHERE w IN b.roster_weeks)
      MATCH (o)-[:PLAYED_FOR {season: $asof_season}]->(:Team {team_id: 'TB'})
      RETURN DISTINCT o.name AS player
    notes: teammates on one team, then on another team now

  - id: g071
    question: "Which players have caught passes from both Aaron Rodgers and Josh Allen?"
    category: graph
    source: graph
    reference: |
      MATCH (:Player {name: 'Aaron Rodgers'})-[a:THREW_TO]->(r:Player)<-[b:THREW_TO]-(j:Player {name: 'Josh Allen'})
      WHERE j.position = 'QB'
      WITH r, sum(a.completions) AS from_rodgers, sum(b.completions) AS from_allen
      WHERE from_rodgers > 0 AND from_allen > 0
      RETURN DISTINCT r.name AS player
    notes: two QBs sharing receivers (2018 on)

  - id: g072
    question: "Who has completed a pass to Davante Adams since 2018?"
    category: graph
    source: graph
    reference: |
      MATCH (q:Player)-[t:THREW_TO]->(:Player {name: 'Davante Adams'})
      WITH q, sum(t.completions) AS catches WHERE catches > 0
      RETURN q.name AS quarterback
    notes: incoming THREW_TO with a completion (a WR's trick-play pass counts)

  - id: g073
    question: "Which current Bears players were drafted by the Packers?"
    category: graph
    source: graph
    reference: |
      MATCH (p:Player)-[:PLAYED_FOR {season: $asof_season}]->(:Team {team_id: 'CHI'})
      MATCH (p)-[:DRAFTED_BY]->(:Team {team_id: 'GB'})
      RETURN DISTINCT p.name AS player
    notes: current roster x draft team

  - id: g074
    question: "Which of this season's head coaches were coordinators under Andy Reid?"
    category: graph
    source: graph
    reference: |
      MATCH (c:Coach)-[:WORKED_UNDER]->(:Coach {name: 'Andy Reid'})
      MATCH (c)-[:HEAD_COACH_OF {season: $asof_season}]->(t:Team)
      RETURN c.name AS coach, t.team_id AS team
    notes: coaching tree x current head coaches

  - id: g075
    question: "How many players have played for both the Patriots and the Jets since 2018?"
    category: graph
    source: graph
    reference: |
      MATCH (:Team {team_id: 'NE'})<-[:PLAYED_FOR]-(p:Player)-[:PLAYED_FOR]->(:Team {team_id: 'NYJ'})
      RETURN count(DISTINCT p) AS players
    notes: one number

  - id: g076
    question: "Which players have been on at least 9 different teams since 2018?"
    category: graph
    source: graph
    reference: |
      MATCH (p:Player)-[:PLAYED_FOR]->(t:Team)
      WITH p, count(DISTINCT t) AS teams WHERE teams >= 9
      RETURN p.name AS player, teams
    notes: journeymen; PLAYED_FOR includes practice-squad and reserve stints on a roster

  - id: g077
    question: "Who has Patrick Mahomes thrown the most touchdown passes to since 2018?"
    category: graph
    source: graph
    reference: |
      MATCH (:Player {name: 'Patrick Mahomes'})-[t:THREW_TO]->(r:Player)
      RETURN r.name AS receiver, sum(t.tds) AS touchdowns
      ORDER BY touchdowns DESC LIMIT 1
    notes: Travis Kelce

  - id: g078
    question: "Which quarterbacks have started a game for the Browns since 2018?"
    category: graph
    source: graph
    reference: |
      MATCH (:Team {team_id: 'CLE'})-[:PLAYED_IN]->(g:Game)<-[a:APPEARED_IN]-(p:Player)
      WHERE a.team_id = 'CLE' AND a.qb_started
      RETURN DISTINCT p.name AS quarterback
    notes: started = most dropbacks for his team in the game

  - id: g079
    question: "Which of this week's matchups also happened last season?"
    category: graph
    source: graph
    reference: |
      MATCH (g:Game {season: $asof_season, week: $asof_week})
      MATCH (p:Game {season: $asof_season - 1})
      WHERE (p.home_team = g.home_team AND p.away_team = g.away_team)
         OR (p.home_team = g.away_team AND p.away_team = g.home_team)
      RETURN DISTINCT g.game_id AS game_id
    notes: one row per this-week game (division rivals met twice); regular season or playoffs

  - id: g080
    question: "Which players traded this year face the team that traded them this week?"
    category: graph
    source: graph
    reference: |
      MATCH (p:Player)-[tr:TRADED_TO]->(t:Team)
      WHERE tr.season = $asof_season
      MATCH (p)-[:PLAYED_FOR {season: $asof_season}]->(t)
      MATCH (t)-[:PLAYED_IN]->(:Game {season: $asof_season, week: $asof_week})<-[:PLAYED_IN]-(o:Team)
      WHERE o.team_id = tr.from_team
      RETURN p.name AS player, t.team_id AS team, o.team_id AS former_team
    notes: trades x this week's schedule (Taron Johnson BUF -> LV in week 6)

  - id: g081
    question: "Which referee has worked the most Chiefs games since 2018?"
    category: graph
    source: graph
    reference: |
      MATCH (o:Official)-[r:OFFICIATED]->(g:Game)<-[:PLAYED_IN]-(:Team {team_id: 'KC'})
      WHERE r.role = 'Referee'
      RETURN o.name AS referee, count(DISTINCT g) AS games
      ORDER BY games DESC LIMIT 1
    notes: officials join games by the old GSIS id at build time

  - id: g082
    question: "Which coaches have been head coach of more than one team since 2018?"
    category: graph
    source: graph
    reference: |
      MATCH (c:Coach)-[:HEAD_COACH_OF]->(t:Team)
      WITH c, count(DISTINCT t) AS teams WHERE teams > 1
      RETURN c.name AS coach
    notes: HEAD_COACH_OF per season, 2018 on; the coaches asked (a teams count was required until the 2026-10-18 audit)

  - id: g083
    question: "Which players were teammates of both Tom Brady and Patrick Mahomes?"
    category: graph
    source: graph
    reference: |
      MATCH (b:Player {name: 'Tom Brady'})-[rb:PLAYED_FOR]->(tb:Team)<-[x:PLAYED_FOR]-(p:Player)
      WHERE rb.season = x.season AND any(w IN rb.roster_weeks WHERE w IN x.roster_weeks)
      WITH DISTINCT p
      MATCH (m:Player {name: 'Patrick Mahomes'})-[rm:PLAYED_FOR]->(tm:Team)<-[y:PLAYED_FOR]-(p)
      WHERE rm.season = y.season AND any(w IN rm.roster_weeks WHERE w IN y.roster_weeks)
      RETURN DISTINCT p.name AS player
    notes: two-hop teammates (2018 on, so Brady's NE and TB years in the graph)

  - id: g084
    question: "Which team has the highest Elo rating this week?"
    category: graph
    source: graph
    reference: |
      MATCH (tw:TeamWeek {season: $asof_season, week: $asof_week})
      RETURN tw.team_id AS team, tw.elo AS elo ORDER BY elo DESC LIMIT 1
    notes: Elo before this week's games

  - id: g085
    question: "Which players have had 10 or more catches in a game this season?"
    category: graph
    source: graph
    reference: |
      MATCH (p:Player)-[a:APPEARED_IN]->(g:Game {season: $asof_season})
      WHERE a.rec >= 10
      RETURN DISTINCT p.name AS player
    notes: APPEARED_IN box score (results before this week); one row per player ("which players"; week and catches per game were required until the 2026-10-18 audit)

  - id: g086
    question: "Which coordinators have worked under both Sean McVay and Kyle Shanahan?"
    category: graph
    source: graph
    reference: |
      MATCH (:Coach {name: 'Sean McVay'})<-[:WORKED_UNDER]-(c:Coach)-[:WORKED_UNDER]->(:Coach {name: 'Kyle Shanahan'})
      RETURN DISTINCT c.name AS coach
    notes: two coaching trees overlapping

  - id: g087
    question: "Which Bills first-round picks since 2018 play for another team this season?"
    category: graph
    source: graph
    reference: |
      MATCH (p:Player)-[d:DRAFTED_BY]->(:Team {team_id: 'BUF'})
      WHERE d.round = 1 AND d.year >= 2018
      MATCH (p)-[:PLAYED_FOR {season: $asof_season}]->(t:Team)
      WHERE t.team_id <> 'BUF'
      RETURN DISTINCT p.name AS player, t.team_id AS team
    notes: draft team x current team

  - id: g088
    question: "Which of this week's games are being played on grass?"
    category: graph
    source: graph
    reference: |
      MATCH (g:Game {season: $asof_season, week: $asof_week})-[:AT]->(v:Venue)
      WHERE v.surface = 'grass'
      RETURN g.game_id AS game_id
    notes: Game -AT-> Venue (international games at the right stadium)

  - id: g089
    question: "Which of Dan Campbell's coordinators have gone on to become head coaches?"
    category: graph
    source: graph
    reference: |
      MATCH (c:Coach)-[w:WORKED_UNDER]->(:Coach {name: 'Dan Campbell'})
      MATCH (c)-[h:HEAD_COACH_OF]->(:Team)
      WITH c, w, min(h.season) AS first_hc
      WHERE first_hc > w.seasons[0]
      RETURN DISTINCT c.name AS coach
    notes: coaching tree x later head-coaching seasons

  - id: g090
    question: "Which players in this week's games face the team that drafted them?"
    category: graph
    source: graph
    reference: |
      MATCH (t:Team)-[:PLAYED_IN]->(:Game {season: $asof_season, week: $asof_week})<-[:PLAYED_IN]-(o:Team)
      MATCH (p:Player)-[pf:PLAYED_FOR {season: $asof_season}]->(t)
      WHERE pf.last_week >= $asof_week - 1 AND coalesce(pf.status_last, 'ACT') <> 'RES'
      MATCH (p)-[:DRAFTED_BY]->(o)
      WHERE NOT EXISTS { MATCH (p)-[x:PLAYED_FOR {season: $asof_season}]->(t2:Team)
                         WHERE t2 <> t AND x.first_week > pf.last_week }
      RETURN p.name AS player, t.team_id AS team, o.team_id AS drafted_by
    notes: on the roster through last week, not on a reserve list

  - id: g091
    question: "Who has caught the most passes from Matthew Stafford since 2018?"
    category: graph
    source: graph
    reference: |
      MATCH (:Player {name: 'Matthew Stafford'})-[t:THREW_TO]->(r:Player)
      RETURN r.name AS receiver, sum(t.completions) AS catches
      ORDER BY catches DESC LIMIT 1
    notes: summed over seasons and teams

  - id: g092
    question: "Which players have played for both the Rams and the Chargers since 2018?"
    category: graph
    source: graph
    reference: |
      MATCH (:Team {team_id: 'LA'})<-[:PLAYED_FOR]-(p:Player)-[:PLAYED_FOR]->(:Team {team_id: 'LAC'})
      RETURN DISTINCT p.name AS player
    notes: a list (the count question is g075)

  - id: g093
    question: "Who has completed a pass to Kenny Gainwell?"
    category: graph
    source: graph
    reference: |
      MATCH (q:Player)-[t:THREW_TO]->(:Player {name: 'Kenny Gainwell'})
      WITH q, sum(t.completions) AS catches WHERE catches > 0
      RETURN q.name AS quarterback
    notes: a running back's passers across PHI / PIT / TB

