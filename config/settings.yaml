# Non-secret application config. Secrets and machine paths live in the env file
# (see .env.example). Values marked "tuned in Pxx" are starting points.

seasons:
  history_start: 2010   # play-by-play history used for training (documentation/04)
  graph_start: 2018     # first season loaded into Neo4j (documentation/05)
  current: 2026

wandb:
  project: nfl-analytics-engine

llm:                      # digest prose writer (documentation/06; D56)
  provider: openrouter    # placeholder | openrouter (any model, Claude too; P09 closed, D87)
  model: z-ai/glm-5.3-flash
  reasoning_effort: max   # OpenRouter reasoning.effort
  max_tokens: 96000       # whole completion, reasoning included (P09: a call used 51k of 64k)
  timeout_seconds: 600
  retries: 2              # extra attempts on timeouts, 429 and 5xx
  openrouter:             # provider routing: only these endpoints, fastest first
    # deepinfra/fp4 dropped in P09 (D87): 3 of its 5 saved calls skipped the reasoning
    only: [baseten/fp8, relace, novita/fp8]
    # Rishi (D88): speed over a cent. BaseTen wrote a digest in 3 min vs Novita 12-25 min.
    # An explicit order, not `sort: throughput`: OpenRouter publishes no throughput stats
    # for these endpoints, and a throughput-sorted test call still went to Novita.
    order: [baseten/fp8, novita/fp8, relace]
    allow_fallbacks: true

# Optional data sources (documentation/03 -> Additional free sources). All fail soft.
sources:
  espn: true
  ngs_site: true
  espn_win_rates: true
  pfr_scrape: true
  open_meteo: true
  odds_api: true          # needs ODDS_API_KEY (ODDS_API_KEY2 = backup)

flags:
  injury_update_enabled: true    # Saturday injury update, run by hand (P07, D73; Q04)

ops:                      # weekly operations (P07; manual-first, D71)
  data_lag_hours: 10      # --as-of simulations: a game counts as final + in play-by-play
                          # this long after kickoff (MNF 20:15 ET -> ready by Tuesday ~06:15)
  neo4j_start_timeout_s: 180   # wait for Neo4j after `docker compose up -d`
  docker_start_timeout_s: 240  # wait for Docker Desktop to come up (Windows)
  wandb_alerts: true      # failures + drift alerts also go to W&B (its own email / app)
  promote_auto: true      # `--auto` moves the `production` alias to each live fit (D72)

drift:                    # documentation/08 -> Drift signals; alerts only, never retunes
  rolling_weeks: 4        # rolling window for the game and player comparisons
  streak_weeks: 3         # ... worse than the baseline this many graded weeks in a row
  ece_max: 0.05           # season ECE of the game model ...
  ece_noise_adjust: true  # ... or the 90th percentile of a perfectly calibrated model's ECE
                          # at this many games if higher (~0.11): 0.05 alone alerted in 85%
                          # of 2019-2025 weeks, the noise floor is ~0.08 (D75)
  ece_min_games: 64       # season ECE is noise before this many graded games (~4 weeks)
  stale_days: 7           # a source whose newest snapshot is older than this is stale
  checks_window_weeks: 4  # "over a month"
  checks_fail_rate_max: 0.20

injury_update:            # Saturday injury update (documentation/06; P07)
  min_prob_move: 0.05     # materiality: a win probability moved >= 5 points ...
  watch_status_change: true   # ... or a watch-list player's injury status changed

ratings:                  # tuned in P02 (D46; sweep dwyj31wk + pbpcouy1, approved 2026-10-03)
  half_life_weeks: 12          # recency half-life of plays (and of the fading prior)
  prior_regression: 0.1        # pull of last season's full-season rating toward average
  ridge_alpha: 250             # shrinkage strength, in recency-weighted plays
  qb_change_regression: 0.0    # extra offense pull after a week-1 QB change (hurt when > 0)
  garbage_weight: 0.25         # weight of plays with win probability < 0.05 or > 0.95
  garbage_wp: 0.05

elo:                      # standard 538-style NFL Elo (P02); checked on 2005-2014
  k: 20
  hfa: 48                 # Elo points; 0 at neutral sites
  revert: 0.333333        # pull 1/3 toward the mean before each season
  mean: 1505
  mov: true               # margin-of-victory multiplier
  start_season: 2002

training:                 # tuned in P03 / P06
  sample_weights:
    current_season: 3.0
    last_season: 1.5
    older: 1.0

game_model:               # game model v0 (P03; documentation/04 -> B)
  win_method: margin      # margin (ridge margin -> normal CDF) | logistic
  margin_alpha: 1.0       # ridge strength on scaled features
  total_alpha: 1.0
  logistic_c: 1.0
  calibration: none       # none | platt | isotonic (fitted on walk-forward predictions)
  sigma_default: 13.5     # margin sd until 400 walk-forward residuals exist
  train_start: 2011       # 2010 ratings have no preseason prior
  burn_in_seasons: 5      # walk-forward seasons before the reported ones (sigma, calibration)
  version: v0             # the model the weekly run fits: v0 (ridge) | v1 (LightGBM, P08)
  v1:                     # game model v1 (P08; models/game_model_v1.py): the best of the
                          # 24-point grid on 2013-2017 (sweep 47vq67gw; every point lost to v0)
    base: ridge           # boost from v0's ridge prediction | none (trees from the average)
    num_leaves: 4
    learning_rate: 0.02
    n_estimators: 50
    min_data_in_leaf: 100
    lambda_l2: 10.0

player_model:             # player model v1 (P06; documentation/04 -> C); LightGBM settings
  num_leaves: 15
  learning_rate: 0.05
  n_estimators: 300
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  lambda_l2: 1.0
  conformal_seasons: 2    # walk-forward seasons the 80% range is calibrated on
  # the targets the weekly run refits + projects (player_schema.live_targets): the 11 P06
  # targets + the 12 P08 ones that beat their baselines (all 12, D82; model card player-p08)
  live_targets: [pass_yds-qb, pass_epa-qb, rush_yds-rb, carries-rb, receptions-rb,
                 scrim_yds-rb, rec_yds-wrte, targets-wrte, receptions-wrte, pressures-edge,
                 tackles-lbs, pass_tds-qb, ints-qb, rush_yds-qb, td-rb, td-wrte, sacks-edge,
                 qb_hits-edge, cov_tgt-cbs, cov_cmp-cbs, cov_yds-cbs, int-cbs, pd-cbs]
  per_target:             # best of the 12-point grid per target, scored on 2017-2018 only (D68)
    pass_yds-qb:     {num_leaves: 7,  min_data_in_leaf: 200, n_estimators: 150}  # sweep rcyuv6pl
    pass_epa-qb:     {num_leaves: 7,  min_data_in_leaf: 200, n_estimators: 150}  # cygm4hbw
    rush_yds-rb:     {num_leaves: 31, min_data_in_leaf: 200, n_estimators: 150}  # glu9cmj8
    carries-rb:      {num_leaves: 15, min_data_in_leaf: 50,  n_estimators: 300}  # 4yqdpr6c
    receptions-rb:   {num_leaves: 15, min_data_in_leaf: 50,  n_estimators: 300}  # 0z30t3eb
    scrim_yds-rb:    {num_leaves: 31, min_data_in_leaf: 200, n_estimators: 150}  # ywgzufw3
    rec_yds-wrte:    {num_leaves: 15, min_data_in_leaf: 200, n_estimators: 150}  # awk1hndy
    targets-wrte:    {num_leaves: 31, min_data_in_leaf: 200, n_estimators: 300}  # 3w91p7lu
    receptions-wrte: {num_leaves: 7,  min_data_in_leaf: 50,  n_estimators: 300}  # lhxih9f7
    pressures-edge:  {num_leaves: 7,  min_data_in_leaf: 200, n_estimators: 150}  # upmglalz (re-run with the label lag; qnn35nz6 picked the same)
    tackles-lbs:     {num_leaves: 15, min_data_in_leaf: 50,  n_estimators: 150}  # uvajbbn7
    # P08 targets (same grid on 2017-2018; also player_runs.TARGET_DEFAULTS, these win)
    pass_tds-qb:     {num_leaves: 15, min_data_in_leaf: 200, n_estimators: 150}  # ct2dr946
    ints-qb:         {num_leaves: 7,  min_data_in_leaf: 200, n_estimators: 300}  # pus3fn5t
    rush_yds-qb:     {num_leaves: 15, min_data_in_leaf: 50,  n_estimators: 300}  # ud7xp3xt
    td-rb:           {num_leaves: 4,  min_data_in_leaf: 300, n_estimators: 100}  # zv4j4md1
    td-wrte:         {num_leaves: 4,  min_data_in_leaf: 100, n_estimators: 100}  # coyymj3b
    sacks-edge:      {num_leaves: 31, min_data_in_leaf: 50,  n_estimators: 150}  # 1wdr6q3m
    qb_hits-edge:    {num_leaves: 15, min_data_in_leaf: 50,  n_estimators: 300}  # bu4pv1s8
    cov_tgt-cbs:     {num_leaves: 7,  min_data_in_leaf: 50,  n_estimators: 300}  # zgwo3kuu
    cov_cmp-cbs:     {num_leaves: 15, min_data_in_leaf: 200, n_estimators: 150}  # smgtm7m6
    cov_yds-cbs:     {num_leaves: 7,  min_data_in_leaf: 200, n_estimators: 150}  # y4yt569d
    int-cbs:         {num_leaves: 4,  min_data_in_leaf: 300, n_estimators: 100}  # eweebi9l
    pd-cbs:          {num_leaves: 4,  min_data_in_leaf: 300, n_estimators: 100}  # 9figg6pe

team_model:               # team stat totals (P08; models/team_runs.py, documentation/11)
  # the ship decision: shipped targets are refit + projected by the weekly `player` step
  # (fail-soft); takeaways didn't beat the league average (model card team-stats-v1)
  live_targets: [pass_yds-team, rush_yds-team, sacks_made-team, sacks_taken-team]

consistency:              # consistency layer on the weekly player projections (P08)
  receptions: true        # WR/TE receptions <= targets at every level (P10 / P50 / P90 / mean)
  rec_yds_anchor: null    # null = log only | team (scale WR/TE receiving yards toward the
                          # team model's passing yards) | qb
  strength: 0.5           # share of the way to the anchor when rec_yds_anchor is set

qb: {}                    # QB status feature (features/qb.py QBParams); defaults in code

digest:                   # prose word budgets per section (documentation/06)
  watchlist_size: 8       # the P04 heuristic fallback's list size (no player projections)
  watchlist_offense: 10   # model players to watch on offense (QB / RB / WR-TE; Rishi, D70)
  watchlist_defense: 10   # ... and on defense (EDGE/DL / LB/S)
  tough_spots: 5          # regular starters projected furthest below their baseline
  word_budgets:
    report_card: 60
    game_outlook: 80
    team_trends: 120
    under_the_hood: 110
    players_to_watch: 200   # 2-3 picks per side in prose (D70); the tables hold all 20
    matchup_risk: 80
    non_obvious: 90

live:                     # live decisions (LD00+; documentation/live-decisions/, D107, D113)
  train_seasons: 2010-2025      # the shipped fit (nfl live train)
  backtest_seasons: 2014-2025   # leave-one-season-out (nfl live backtest)
  models:                 # code defaults in live/models.py DEFAULTS; these win
    wp:   {num_leaves: 7, learning_rate: 0.05, n_estimators: 150, min_data_in_leaf: 200}
                          # boosted from a logistic base (models.WPModel; tuning window 2010-13)
    gain: {num_leaves: 4, learning_rate: 0.15, n_estimators: 50, min_data_in_leaf: 300,
           lambda_l2: 10.0}   # lr 0.15 = lr 0.05's accuracy with 1/3 of the trees (speed)
    pass: {num_leaves: 31, learning_rate: 0.05, n_estimators: 600, min_data_in_leaf: 200}
    n_boot: 20            # bootstrap refits of gain + fg behind the confidence label
  decide:
    toss_up_gap: 0.01     # a gap under 1 win-probability point is a toss-up
    confident: 0.90       # the best option wins in >= 90% of the bootstraps
    lean: 0.60            # 60-90%: lean; under 60%: toss-up
    boot_gap: 0.05        # the bootstraps score calls closer than 5 points; no wider
                          # call flipped in 1,498 real 2025 4th downs (D113)
