<meta charset="utf-8">
<title>Game Day Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
{{CSS}}
</style>
<style>
{{GDCSS}}
</style>

<div class="mockbar" id="mockbar" aria-label="Mockup controls">
  <span class="tag">MOCKUP CONTROLS · not part of the app</span>
  <div class="grp"><span class="lbl">Game day</span><span class="seg" id="gdPick"><button type="button" data-v="before">Before kickoff</button><button type="button" data-v="live">Games on</button><button type="button" data-v="between">No game on</button><button type="button" data-v="final">All final</button><button type="button" data-v="past">Past week</button><button type="button" data-v="nomodels">No models</button></span></div>
  <div class="grp" id="momentGrp"><span class="lbl">The play</span><span class="seg" id="momentPick"><button type="button" data-v="fourth_close">4th · close</button><button type="button" data-v="fourth_tossup">4th · toss-up</button><button type="button" data-v="third">3rd down</button><button type="button" data-v="behind">ESPN behind</button><button type="button" data-v="stale">Stale feed</button><button type="button" data-v="repeat">Repeat check</button><button type="button" data-v="none">Not 3rd / 4th</button></span></div>
  <div class="grp" id="checkGrp"><span class="lbl">Check button</span><span class="seg" id="checkPick"><button type="button" data-v="idle">Idle</button><button type="button" data-v="loading">Loading</button><button type="button" data-v="answer">Answer</button><button type="button" data-v="error">Error</button></span></div>
  <span class="hint">In the app: theme and mode under the gear by "Control Room". Only the Game day tab is drawn here; the other tabs are in the control room mockup.</span>
</div>

<div class="app">
  <aside class="side" id="side"></aside>
  <main>
    <header class="top" id="top"></header>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Week sections"></nav>
    <section class="view" id="view"></section>
  </main>
</div>

<div id="tip" role="tooltip" hidden></div>

<script id="data" type="application/json">{{DATA}}</script>
<script>
{{JS}}
</script>
