# Neo4j for the knowledge graph (documentation/05 -> Runtime).
# Values come from the repo env file (NFL_DATA_ROOT, NEO4J_PASSWORD, optional NEO4J_USER).
# Database files, logs and downloaded plugins live on the D: data drive via bind mounts.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: nfl-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      # NEO4JS_PASSWORD = temporary fallback for a misspelled env-file line (2026-10-03).
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-${NEO4JS_PASSWORD:?NEO4J_PASSWORD must be set}}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - ${NFL_DATA_ROOT:?NFL_DATA_ROOT must be set}/neo4j/data:/data
      - ${NFL_DATA_ROOT}/neo4j/logs:/logs
      - ${NFL_DATA_ROOT}/neo4j/plugins:/plugins
    restart: unless-stopped
